services:

  mosquitto:
    build:
      context: https://github.com/Balou866/SilenceDashboard.git
      dockerfile: mosquitto/Dockerfile
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "9002:9001"
    volumes:
      - mosquitto-data:/mosquitto/data

  mqtt-retain:
    build:
      context: https://github.com/Balou866/SilenceDashboard.git
      dockerfile: mqtt-retain/Dockerfile
    container_name: silence-retain
    restart: unless-stopped
    volumes:
      - trip-data:/data

  silence-server:
    build:
      context: https://github.com/Balou866/SilenceDashboard.git
      dockerfile: silence/Dockerfile
    container_name: silence-server
    restart: unless-stopped
    environment:
      - IMEI=${IMEI:-TON_IMEI}   # à définir dans "Environment variables" de Portainer : Nom = IMEI  |  Valeur = numéro (ex: 860000000000000)
    ports:
      - "38955:38955"

  dashboard:
    build:
      context: https://github.com/Balou866/SilenceDashboard.git
      dockerfile: dashboard/Dockerfile
    container_name: silence-dashboard
    restart: unless-stopped
    environment:
      - IMEI=${IMEI:-TON_IMEI}
    ports:
      - "8083:80"
    volumes:
      - trip-data:/usr/share/nginx/html/data:ro

volumes:
  mosquitto-data:
  trip-data:
